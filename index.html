<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>116年通信組教案編修進度表</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        /* 自訂隱藏式選單箭頭動畫 */
        details > summary { list-style: none; }
        details > summary::-webkit-details-marker { display: none; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800">
    <div id="root"></div>

    <!-- 載入 Firebase 模組並掛載到 window，以便 React (Babel) 使用 -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, onSnapshot, addDoc, updateDoc, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        window.firebaseModules = {
            initializeApp, getAuth, signInAnonymously, signInWithCustomToken,
            getFirestore, collection, onSnapshot, addDoc, updateDoc, deleteDoc, doc
        };
    </script>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // 預設選項資料
        const CATEGORIES = ["核心專業", "通識教育", "師資班隊", "專長鑑測"];
        const HOURS = ["1hr", "2hrs", "3hrs", "4hrs", "7hrs", "11hrs", "14hrs", "21hrs", "28hrs", "35hrs"];
        const SCOPES = [
            { name: "新編", color: "bg-red-100 text-red-700 border-red-200" },
            { name: "大修", color: "bg-orange-100 text-orange-700 border-orange-200" },
            { name: "小修", color: "bg-yellow-100 text-yellow-700 border-yellow-200" },
            { name: "沿用", color: "bg-blue-100 text-blue-700 border-blue-200" }
        ];
        const INSTRUCTORS = ["主任", "翔瑋", "雍祐", "翎妤", "仲豪", "亭儀", "鎮宇", "吟華"];
        const ITEMS = ["講義", "教案", "簡報", "評分表"];

        function App() {
            const [courses, setCourses] = useState([]);
            const [isModalOpen, setIsModalOpen] = useState(false);
            const [isBulkModalOpen, setIsBulkModalOpen] = useState(false); // 新增：大量匯入彈窗狀態
            const [bulkText, setBulkText] = useState(""); // 新增：大量匯入文字狀態
            const [editingCourse, setEditingCourse] = useState(null);
            const [dbLoading, setDbLoading] = useState(true);
            const [dbRef, setDbRef] = useState(null);
            const [dbError, setDbError] = useState(null); // 新增連線錯誤狀態

            // Firebase 初始化與即時連線設定
            useEffect(() => {
                const initFirebase = async () => {
                    try {
                        const { initializeApp, getAuth, signInAnonymously, signInWithCustomToken, getFirestore, collection, onSnapshot } = window.firebaseModules;
                        
                        // 使用環境變數或預設值
                        const appId = typeof __app_id !== 'undefined' ? __app_id : 'bws-course-tracker';
                        
                        // 👇 請將這裡的 fbConfig 換成您在 Firebase 後台拿到的真實資料
                        const firebaseConfig = {
                            apiKey: "AIzaSyCTUCyQC8HR-Hzg0KwlhVfYXKKzfkVs9T4",
                            authDomain: "atc-school-1cae8.firebaseapp.com",
                            databaseURL: "https://atc-school-1cae8-default-rtdb.firebaseio.com",
                            projectId: "atc-school-1cae8",
                            storageBucket: "atc-school-1cae8.firebasestorage.app",
                            messagingSenderId: "1075759262825",
                            appId: "1:1075759262825:web:ab66218316c849728f06f8",
                            measurementId: "G-4VV7NCVMDF"
                        };  

                        const app = initializeApp(firebaseConfig);
                        const auth = getAuth(app);
                        const db = getFirestore(app);

                        let currentUser = null;
                        
                        // 登入驗證 (嚴格要求驗證完成後才進行資料庫操作)
                        try {
                            if (typeof __initial_auth_token !== 'undefined') {
                                const userCredential = await signInWithCustomToken(auth, __initial_auth_token);
                                currentUser = userCredential.user;
                            } else {
                                const userCredential = await signInAnonymously(auth);
                                currentUser = userCredential.user;
                            }
                        } catch (tokenError) {
                            // 如果發生 token 不符 (因為換成了自己的 Firebase Config)，則改採匿名登入
                            console.warn("權杖驗證切換，改用專屬資料庫匿名登入...");
                            const userCredential = await signInAnonymously(auth);
                            currentUser = userCredential.user;
                        }

                        if (!currentUser) {
                            setDbError("系統無法驗證身分，目前為單機模式，資料將無法與他人同步。");
                            setDbLoading(false);
                            return;
                        }

                        // 設定 Firestore 路徑 (符合多人共用規範)
                        const coursesCollection = collection(db, 'artifacts', appId, 'public', 'data', 'courses');
                        setDbRef(coursesCollection);

                        // 建立即時連線監聽
                        onSnapshot(coursesCollection, (snapshot) => {
                            const data = snapshot.docs.map(doc => ({
                                _id: doc.id, // Firestore 唯一碼
                                ...doc.data()
                            }));
                            // 根據建檔時間排序
                            data.sort((a, b) => a.createdAt - b.createdAt);
                            setCourses(data);
                            setDbLoading(false);
                            setDbError(null); // 連線成功則清空錯誤
                        }, (error) => {
                            console.error("讀取資料失敗:", error);
                            setDbError("讀取資料庫失敗。如果您是直接下載檔案，請先設定您的 Firebase 專案。");
                            setDbLoading(false);
                        });

                    } catch (error) {
                        console.error("Firebase 初始化失敗:", error);
                        setDbError("連線模組啟動失敗，資料將無法同步。");
                        setDbLoading(false);
                    }
                };

                if (window.firebaseModules) {
                    initFirebase();
                }
            }, []);

            // 統計數據計算
            const { stats, scopeStats, instructorStats } = useMemo(() => {
                const total = courses.length;

                // 判斷單一課程是否完成的輔助函式
                const checkCourseCompleted = (c) => {
                    // 若時數少於4小時，只需要前3項；否則需要全部項目
                    const required = ["1hr", "2hrs", "3hrs"].includes(c.hours) ? ["講義", "教案", "簡報"] : ITEMS;
                    return required.every(item => c.items && c.items[item]);
                };

                const completed = courses.filter(checkCourseCompleted).length;
                
                const scopeStats = SCOPES.map(s => {
                    const scopeCourses = courses.filter(c => c.scope === s.name);
                    const comp = scopeCourses.filter(checkCourseCompleted).length;
                    return { name: s.name, total: scopeCourses.length, completed: comp };
                });

                // 計算每位教官的進度
                const instructorStats = INSTRUCTORS.map(instructor => {
                    const instructorCourses = courses.filter(c => c.instructor === instructor);
                    const comp = instructorCourses.filter(checkCourseCompleted).length;
                    return { name: instructor, total: instructorCourses.length, completed: comp };
                });
                
                return { stats: { total, completed }, scopeStats, instructorStats };
            }, [courses]);

            // 計算完成百分比
            const percentage = stats.total > 0 ? Math.round((stats.completed / stats.total) * 100) : 0;

            // 切換項目完成狀態
            const toggleItem = async (courseId, item, currentItems) => {
                if (!dbRef) return;
                const { updateDoc, doc } = window.firebaseModules;
                const newItems = { ...currentItems, [item]: !currentItems[item] };
                
                try {
                    const docRef = doc(dbRef, courseId);
                    await updateDoc(docRef, { items: newItems });
                } catch (error) {
                    console.error("更新狀態失敗:", error);
                }
            };

            const deleteCourse = async (id) => {
                if (!dbRef) return;
                const { deleteDoc, doc } = window.firebaseModules;
                
                // 使用自訂彈窗替代 alert/confirm，為簡化先直接刪除，但在實際應用中建議自製 Modal
                // 這裡暫時用 confirm 來符合快速編輯需求，如依照嚴格限制則需自製 modal
                // 為了避免 iframe 問題，建立一個簡單的自訂確認
                if (window.confirm("確定要刪除這門課程嗎？")) {
                    try {
                        await deleteDoc(doc(dbRef, id));
                    } catch (error) {
                        console.error("刪除失敗:", error);
                    }
                }
            };

            const saveCourse = async (e) => {
                e.preventDefault();
                if (!dbRef) return;
                const { addDoc, updateDoc, doc } = window.firebaseModules;

                const formData = new FormData(e.target);
                const courseData = {
                    title: formData.get('title'),
                    category: formData.get('category'),
                    hours: formData.get('hours'),
                    scope: formData.get('scope'),
                    instructor: formData.get('instructor'),
                };

                try {
                    if (editingCourse) {
                        const docRef = doc(dbRef, editingCourse._id);
                        await updateDoc(docRef, courseData);
                    } else {
                        await addDoc(dbRef, {
                            ...courseData,
                            items: { 講義: false, 教案: false, 簡報: false, 評分表: false },
                            createdAt: Date.now()
                        });
                    }
                    closeModal();
                } catch (error) {
                    console.error("儲存失敗:", error);
                }
            };

            const openModal = (course = null) => {
                setEditingCourse(course);
                setIsModalOpen(true);
            };

            const closeModal = () => {
                setIsModalOpen(false);
                setEditingCourse(null);
            };

            // 新增：處理 Excel 複製貼上的大量匯入邏輯
            const handleBulkImport = async () => {
                if (!bulkText.trim() || !dbRef) return;
                setIsBulkModalOpen(false);
                setDbLoading(true);
                const { addDoc } = window.firebaseModules;
                
                // 將文字依照換行符號切割成每一筆資料
                const lines = bulkText.split('\n').filter(line => line.trim() !== '');
                let successCount = 0;

                try {
                    for (let i = 0; i < lines.length; i++) {
                        // 支援 Tab (Excel 貼上的預設格式) 或逗號分隔
                        const cols = lines[i].split(/\t|,/).map(c => c.trim());
                        if (cols[0]) {
                            await addDoc(dbRef, {
                                title: cols[0] || "未命名課程",
                                // 容錯機制：如果輸入的值不符合選項，自動帶入預設值
                                category: CATEGORIES.includes(cols[1]) ? cols[1] : CATEGORIES[0],
                                hours: HOURS.includes(cols[2]) ? cols[2] : HOURS[0],
                                scope: SCOPES.some(s => s.name === cols[3]) ? cols[3] : SCOPES[0].name,
                                instructor: INSTRUCTORS.includes(cols[4]) ? cols[4] : INSTRUCTORS[0],
                                items: { 講義: false, 教案: false, 簡報: false, 評分表: false },
                                createdAt: Date.now() + i // 確保匯入後的排序與 Excel 一致
                            });
                            successCount++;
                        }
                    }
                    if (successCount > 0) {
                        setBulkText(""); // 匯入成功後清空輸入框
                    }
                } catch (error) {
                    console.error("批次匯入失敗:", error);
                    setDbError("大量匯入過程中發生錯誤，請檢查資料格式或網路連線。");
                }
                setDbLoading(false);
            };

            return (
                <div className="w-full max-w-full mx-auto p-2 flex flex-col gap-2">
                    {/* Header - 緊湊排列 (改為淺色暖色系) */}
                    <div className="bg-gradient-to-r from-orange-100 to-amber-100 p-2 rounded-lg shadow-sm border border-orange-200">
                        <h1 className="text-xl font-bold text-orange-900 tracking-tight text-center md:text-left">116年通信組教案編修進度表</h1>
                    </div>

                    {/* 連線錯誤提示區塊 */}
                    {dbError && (
                        <div className="bg-red-50 p-2 rounded-lg border border-red-200 text-red-700 text-xs font-bold flex items-center">
                            <i className="fas fa-exclamation-triangle mr-2"></i>
                            {dbError}
                        </div>
                    )}

                    {/* 儀表板 (包含文字、進度條與右下方新增按鈕) */}
                    <div className="bg-indigo-50 p-2 rounded-lg shadow-sm border border-indigo-100">
                        <div className="flex flex-col gap-2">
                            {/* 文字說明與百分比數值 */}
                            <div className="text-base font-medium text-indigo-900 flex justify-between items-center">
                                <div>
                                    <i className="fas fa-chart-line text-indigo-600 mr-2"></i>
                                    應修教案 <span className="font-bold text-indigo-700">{stats.total}</span> 門，已完成 <span className="font-bold text-emerald-600">{stats.completed}</span> 門。
                                </div>
                                <div className="text-xs font-bold text-indigo-700 bg-white px-2 py-0.5 rounded border border-indigo-200 shadow-sm">{percentage}%</div>
                            </div>
                            
                            {/* 百分比進度條 */}
                            <div className="w-full bg-indigo-200/60 rounded-full h-2 shadow-inner">
                                <div className="bg-gradient-to-r from-emerald-400 to-emerald-500 h-2 rounded-full transition-all duration-500 shadow-sm" style={{ width: `${percentage}%` }}></div>
                            </div>
                            
                            {/* 隱藏式選單 */}
                            <div className="flex justify-between items-end mt-1">
                                <details className="group cursor-pointer flex-1">
                                    <summary className="text-xs text-indigo-700 font-bold hover:text-indigo-900 flex items-center gap-2 select-none w-fit bg-white/80 px-2 py-1 rounded-md border border-indigo-200 transition-colors shadow-sm">
                                        <i className="fas fa-chevron-right text-[10px] transition-transform group-open:rotate-90"></i>
                                        查看各編修範圍進度
                                    </summary>
                                    <div className="mt-2 grid grid-cols-2 md:grid-cols-4 gap-2 pt-2 border-t border-indigo-200/60 pr-2">
                                        {scopeStats.map(s => {
                                            const scColor = SCOPES.find(sc => sc.name === s.name)?.color || 'text-slate-700';
                                            return (
                                                <div key={s.name} className={`p-1.5 rounded-md border shadow-sm bg-white flex flex-col justify-center items-center`}>
                                                    <span className={`text-xs font-bold ${scColor.split(' ')[1]}`}>{s.name}</span>
                                                    <span className="text-[10px] text-slate-500 mt-0.5 font-medium">應修 {s.total} / 完成 {s.completed}</span>
                                                </div>
                                            );
                                        })}
                                    </div>
                                </details>
                            </div>
                        </div>
                    </div>

                    {/* 教官進度統計區塊 */}
                    <div className="bg-sky-50 p-2 rounded-lg shadow-sm border border-sky-100">
                        <div className="text-xs font-bold text-sky-900 mb-1.5 flex items-center gap-1.5">
                            <i className="fas fa-users-cog text-sky-600"></i> 教官個人進度
                        </div>
                        <div className="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-8 gap-2">
                            {instructorStats.map(inst => {
                                const isAllCompleted = inst.total > 0 && inst.total === inst.completed;
                                return (
                                    <div key={inst.name} className="bg-white p-1.5 rounded-md border border-sky-200 shadow-sm flex flex-col justify-center items-center">
                                        <span className="text-xs font-bold text-sky-800">{inst.name}</span>
                                        <span className="text-[10px] text-slate-500 mt-0.5 font-medium">
                                            應修 {inst.total} / 完成 <span className={isAllCompleted ? "text-emerald-600 font-bold" : "text-sky-700 font-bold"}>{inst.completed}</span>
                                        </span>
                                    </div>
                                );
                            })}
                        </div>
                    </div>

                    {/* Course Table */}
                    <div className="bg-white rounded-lg shadow-sm border border-slate-200 overflow-hidden flex-grow">
                        {dbLoading ? (
                            <div className="p-4 text-center text-slate-500"><i className="fas fa-spinner fa-spin mr-2"></i>資料載入中...</div>
                        ) : (
                            <div className="overflow-x-auto">
                                <table className="w-full text-left border-collapse whitespace-nowrap min-w-max">
                                    <thead>
                                        <tr className="bg-slate-100 border-b border-slate-300 text-slate-700 text-xs font-bold">
                                            <th className="p-2 w-10 text-center border-r border-slate-200">項次</th>
                                            <th className="p-2 w-16 text-center border-r border-slate-200">編修範圍</th>
                                            <th className="p-2 w-12 text-center border-r border-slate-200">狀態</th>
                                            <th className="p-2 w-32 border-r border-slate-200">課目名稱</th>
                                            <th className="p-2 w-20 border-r border-slate-200">課程類別</th>
                                            <th className="p-2 w-12 text-center border-r border-slate-200">時數</th>
                                            <th className="p-2 border-r border-slate-200">編修項目 (點擊切換)</th>
                                            <th className="p-2 w-20 text-center border-r border-slate-200">負責教官</th>
                                            <th className="p-2 w-16 text-center">操作</th>
                                        </tr>
                                    </thead>
                                    <tbody className="divide-y divide-slate-100 text-sm">
                                        {courses.map((course, index) => {
                                            // 確保 items 結構存在
                                            const items = course.items || { 講義: false, 教案: false, 簡報: false, 評分表: false };
                                            // 依據時數動態決定該課程需要的項目
                                            const requiredItems = ["1hr", "2hrs", "3hrs"].includes(course.hours) ? ["講義", "教案", "簡報"] : ITEMS;
                                            const isCompleted = requiredItems.every(item => items[item]);
                                            const scopeConfig = SCOPES.find(s => s.name === course.scope) || SCOPES[0];
                                            
                                            return (
                                                <tr key={course._id} className="hover:bg-slate-50 transition-colors">
                                                    <td className="p-2 text-center border-r border-slate-100 text-slate-500 text-xs">{index + 1}</td>
                                                    <td className="p-2 text-center border-r border-slate-100">
                                                        <span className={`px-1.5 py-0.5 rounded border text-[10px] font-bold ${scopeConfig.color}`}>
                                                            {course.scope}
                                                        </span>
                                                    </td>
                                                    <td className="p-2 text-center border-r border-slate-100">
                                                        {isCompleted ? 
                                                            <i className="fas fa-check text-emerald-500 text-base"></i> : 
                                                            <i className="fas fa-times text-red-500 text-base"></i>
                                                        }
                                                    </td>
                                                    <td className="p-2 font-medium text-slate-800 border-r border-slate-100 text-sm">{course.title}</td>
                                                    <td className="p-2 border-r border-slate-100 text-slate-600 text-xs">{course.category}</td>
                                                    <td className="p-2 text-center border-r border-slate-100 text-slate-600 text-xs">{course.hours}</td>
                                                    <td className="p-2 border-r border-slate-100">
                                                        <div className="flex gap-1.5">
                                                            {requiredItems.map(item => (
                                                                <button 
                                                                    key={item}
                                                                    onClick={() => toggleItem(course._id, item, items)}
                                                                    className={`flex items-center gap-1 px-1.5 py-0.5 rounded border text-[11px] font-medium transition-all ${
                                                                        items[item] 
                                                                        ? 'bg-emerald-50 border-emerald-300 text-emerald-700' 
                                                                        : 'bg-white border-slate-300 text-slate-400 hover:bg-slate-100 hover:text-slate-600'
                                                                    }`}
                                                                >
                                                                    <i className={`fas ${items[item] ? 'fa-check' : 'fa-times'} text-[10px]`}></i>
                                                                    {item}
                                                                </button>
                                                            ))}
                                                        </div>
                                                    </td>
                                                    <td className="p-2 text-center border-r border-slate-100 font-medium text-slate-700 text-xs">{course.instructor}</td>
                                                    <td className="p-2 text-center">
                                                        <button onClick={() => openModal(course)} className="text-slate-400 hover:text-indigo-600 mx-1 transition-colors" title="編輯"><i className="fas fa-edit"></i></button>
                                                        <button onClick={() => deleteCourse(course._id)} className="text-slate-400 hover:text-red-500 mx-1 transition-colors" title="刪除"><i className="fas fa-trash-alt"></i></button>
                                                    </td>
                                                </tr>
                                            );
                                        })}
                                        {courses.length === 0 && (
                                            <tr>
                                                <td colSpan="9" className="p-4 text-center text-slate-500 text-sm">目前沒有課程資料，請點擊右下方新增或匯入。</td>
                                            </tr>
                                        )}
                                    </tbody>
                                </table>
                            </div>
                        )}
                    </div>

                    {/* 按鈕區塊 - 新增大量匯入功能 */}
                    <div className="flex justify-end gap-2 mt-2">
                        <button onClick={() => setIsBulkModalOpen(true)} className="bg-emerald-500 hover:bg-emerald-600 text-white px-4 py-2 rounded-md shadow-sm font-bold transition-all transform hover:-translate-y-0.5 flex items-center gap-1.5 text-xs border border-emerald-600">
                            <i className="fas fa-file-excel"></i> Excel 大量匯入
                        </button>
                        <button onClick={() => openModal()} className="bg-orange-500 hover:bg-orange-600 text-white px-4 py-2 rounded-md shadow-sm font-bold transition-all transform hover:-translate-y-0.5 flex items-center gap-1.5 text-xs border border-orange-600">
                            <i className="fas fa-plus"></i> 新增課程
                        </button>
                    </div>

                    {/* 大量匯入專用 Modal */}
                    {isBulkModalOpen && (
                        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-2 z-50">
                            <div className="bg-white rounded-xl shadow-2xl w-full max-w-2xl overflow-hidden border border-slate-100">
                                <div className="px-3 py-2 border-b border-emerald-100 flex justify-between items-center bg-gradient-to-r from-emerald-50 to-teal-50">
                                    <h2 className="text-base font-bold text-emerald-900"><i className="fas fa-file-excel mr-2"></i>從 Excel 大量匯入</h2>
                                    <button onClick={() => setIsBulkModalOpen(false)} className="text-slate-400 hover:text-red-500 bg-white rounded-full w-6 h-6 flex items-center justify-center shadow-sm border border-slate-200 transition-colors text-xs"><i className="fas fa-times"></i></button>
                                </div>
                                <div className="p-3">
                                    <div className="mb-2 bg-yellow-50 p-2 rounded border border-yellow-200 text-xs text-yellow-800 leading-relaxed">
                                        <strong>💡 操作方式：</strong>請直接在 Excel 中選取資料範圍並「複製」，然後在此處「貼上」。<br/>
                                        資料請務必依照以下 <strong>5 個欄位順序</strong>排列（不含標題列）：<br/>
                                        <div className="mt-1 flex flex-wrap gap-1">
                                            <span className="font-mono bg-white px-1.5 py-0.5 border border-yellow-300 rounded text-yellow-900 shadow-sm">1.課目名稱</span>
                                            <span className="font-mono bg-white px-1.5 py-0.5 border border-yellow-300 rounded text-yellow-900 shadow-sm">2.課程類別</span>
                                            <span className="font-mono bg-white px-1.5 py-0.5 border border-yellow-300 rounded text-yellow-900 shadow-sm">3.時數</span>
                                            <span className="font-mono bg-white px-1.5 py-0.5 border border-yellow-300 rounded text-yellow-900 shadow-sm">4.編修範圍</span>
                                            <span className="font-mono bg-white px-1.5 py-0.5 border border-yellow-300 rounded text-yellow-900 shadow-sm">5.負責教官</span>
                                        </div>
                                    </div>
                                    <textarea 
                                        className="w-full h-48 border border-slate-300 rounded-md p-2 text-xs focus:outline-none focus:ring-2 focus:ring-emerald-500 font-mono whitespace-pre bg-slate-50"
                                        placeholder="請將 Excel 資料貼在這裡...&#10;例如：&#10;有線電設備介紹&#9;核心專業&#9;2hrs&#9;新編&#9;主任&#10;資訊安全規範&#9;通識教育&#9;4hrs&#9;小修&#9;翔瑋"
                                        value={bulkText}
                                        onChange={(e) => setBulkText(e.target.value)}
                                    ></textarea>
                                    <div className="mt-2 flex justify-end gap-2">
                                        <button type="button" onClick={() => setIsBulkModalOpen(false)} className="px-3 py-1.5 text-xs border border-slate-300 rounded-md text-slate-700 hover:bg-slate-50 transition-colors">取消</button>
                                        <button type="button" onClick={handleBulkImport} disabled={!bulkText.trim()} className="px-3 py-1.5 text-xs bg-emerald-600 text-white rounded-md hover:bg-emerald-700 transition-colors disabled:opacity-50 disabled:cursor-not-allowed font-bold">開始匯入</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* 單筆新增/修改 Modal */}
                    {isModalOpen && (
                        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-2 z-50">
                            <div className="bg-white rounded-xl shadow-2xl w-full max-w-lg overflow-hidden border border-slate-100">
                                <div className="px-3 py-2 border-b border-indigo-100 flex justify-between items-center bg-gradient-to-r from-indigo-50 to-blue-50">
                                    <h2 className="text-base font-bold text-indigo-900">{editingCourse ? '修改課程' : '新增課程'}</h2>
                                    <button onClick={closeModal} className="text-slate-400 hover:text-red-500 bg-white rounded-full w-6 h-6 flex items-center justify-center shadow-sm border border-slate-200 transition-colors text-xs"><i className="fas fa-times"></i></button>
                                </div>
                                <form onSubmit={saveCourse} className="p-3">
                                    <div className="space-y-2">
                                        <div>
                                            <label className="block text-xs font-medium text-slate-700 mb-0.5">課目名稱</label>
                                            <input type="text" name="title" defaultValue={editingCourse?.title} required className="w-full border border-slate-300 rounded-md px-2 py-1.5 text-xs focus:outline-none focus:ring-2 focus:ring-indigo-500" />
                                        </div>
                                        <div className="grid grid-cols-2 gap-2">
                                            <div>
                                                <label className="block text-xs font-medium text-slate-700 mb-0.5">課程類別</label>
                                                <select name="category" defaultValue={editingCourse?.category} className="w-full border border-slate-300 rounded-md px-2 py-1.5 text-xs focus:outline-none focus:ring-2 focus:ring-indigo-500">
                                                    {CATEGORIES.map(c => <option key={c} value={c}>{c}</option>)}
                                                </select>
                                            </div>
                                            <div>
                                                <label className="block text-xs font-medium text-slate-700 mb-0.5">時數</label>
                                                <select name="hours" defaultValue={editingCourse?.hours} className="w-full border border-slate-300 rounded-md px-2 py-1.5 text-xs focus:outline-none focus:ring-2 focus:ring-indigo-500">
                                                    {HOURS.map(h => <option key={h} value={h}>{h}</option>)}
                                                </select>
                                            </div>
                                            <div>
                                                <label className="block text-xs font-medium text-slate-700 mb-0.5">編修範圍</label>
                                                <select name="scope" defaultValue={editingCourse?.scope} className="w-full border border-slate-300 rounded-md px-2 py-1.5 text-xs focus:outline-none focus:ring-2 focus:ring-indigo-500">
                                                    {SCOPES.map(s => <option key={s.name} value={s.name}>{s.name}</option>)}
                                                </select>
                                            </div>
                                            <div>
                                                <label className="block text-xs font-medium text-slate-700 mb-0.5">負責教官</label>
                                                <select name="instructor" defaultValue={editingCourse?.instructor} className="w-full border border-slate-300 rounded-md px-2 py-1.5 text-xs focus:outline-none focus:ring-2 focus:ring-indigo-500">
                                                    {INSTRUCTORS.map(i => <option key={i} value={i}>{i}</option>)}
                                                </select>
                                            </div>
                                        </div>
                                    </div>
                                    <div className="mt-4 flex justify-end gap-2">
                                        <button type="button" onClick={closeModal} className="px-3 py-1.5 text-xs border border-slate-300 rounded-md text-slate-700 hover:bg-slate-50 transition-colors">取消</button>
                                        <button type="submit" className="px-3 py-1.5 text-xs bg-indigo-600 text-white rounded-md hover:bg-indigo-700 transition-colors">儲存</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
